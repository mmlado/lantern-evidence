[package]
name = "bls-bench-guest"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
risc0-zkvm = { version = "3.0.5", default-features = false, features = ["std", "unstable"] }
serde = { version = "1", features = ["derive"] }
bls12_381 = { version = "0.8.0", features = ["experimental"] }
sha2 = "0.9"
group = "0.13"
alloy-primitives = "0.8.15"
alloy-trie = "0.7.9"
blst = "0.3.16"

[patch.crates-io]
bls12_381 = { git = "https://github.com/risc0/zkcrypto-bls12_381", tag = "bls12_381/v0.8.0-risczero.1" }
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.9.9-risczero.0" }
tiny-keccak = { git = "https://github.com/risc0/tiny-keccak", tag = "tiny-keccak/v2.0.2-risczero.0" }
blst = { git = "https://github.com/risc0/blst", tag = "v0.3.16-risczero.0" }
