[package]
name = "lantern-spike-guest"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[[bin]]
name = "lantern_spike"
path = "src/main.rs"

[dependencies]
alloy-primitives = "0.8.15"
alloy-rlp = { version = "0.3", features = ["derive"] }
alloy-trie = "0.7.9"
blst = "0.3.16"
borsh = { version = "1.5.7", features = ["derive"] }
lantern-spike-core = { path = "../../core" }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "bafd07be0701398f9bc435f73ab05e9a7936c301" }
risc0-zkvm = { version = "3.0.5", default-features = false, features = ["std"] }

[patch.crates-io]
blst = { git = "https://github.com/risc0/blst", tag = "v0.3.16-risczero.0" }
tiny-keccak = { git = "https://github.com/risc0/tiny-keccak", tag = "tiny-keccak/v2.0.2-risczero.0" }

[profile.release]
opt-level = 3
lto = true
