[package]
name = "lantern-spike-runner"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
blst = "0.3.16"
borsh = { version = "1.5.7", features = ["derive"] }
hex = "0.4"
lantern-spike-core = { path = "../core" }
lee = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "bafd07be0701398f9bc435f73ab05e9a7936c301" }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "bafd07be0701398f9bc435f73ab05e9a7936c301" }
program_loader_core = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "bafd07be0701398f9bc435f73ab05e9a7936c301" }
risc0-binfmt = "3.0.5"
sequencer_service_rpc = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "bafd07be0701398f9bc435f73ab05e9a7936c301", features = ["client"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wallet = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "bafd07be0701398f9bc435f73ab05e9a7936c301" }
